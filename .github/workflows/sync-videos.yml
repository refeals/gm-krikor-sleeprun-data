name: Sync YouTube episodes

# Links the games of any new episode and commits data/game-videos.json;
# Vercel redeploys on the push. Nothing is committed when nothing changed.
on:
  schedule:
    # 14:00 in Brasília (UTC-3). Episodes come out around lunchtime.
    - cron: "0 17 * * *"
  workflow_dispatch:

# The push goes through SYNC_TOKEN below, so the built-in token only reads.
permissions:
  contents: read

concurrency:
  group: sync-videos

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # main is protected, and the workflow's own token can't push to it.
      # SYNC_TOKEN is the owner's fine-grained token (Contents: read and
      # write on this repository), which may.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # jpeg-js reads the video thumbnails (scripts/storyboard.mts).
      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Link games to episodes
        run: pnpm --silent sync:videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit the new links
        run: |
          if git diff --quiet -- data/game-videos.json; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-videos.json
          git commit -m "chore: sync YouTube episodes"
          git push
