name: Sync YouTube episodes

# Episodes come out around 15:00 UTC. This links the games of any new one and
# commits data/game-videos.json; Vercel redeploys on the push.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-videos

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The script imports only Node built-ins and local files: no install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Link games to episodes
        run: npm run --silent sync:videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit the new links
        run: |
          if git diff --quiet -- data/game-videos.json; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-videos.json
          git commit -m "chore: sync YouTube episodes"
          git push
