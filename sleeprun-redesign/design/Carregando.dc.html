<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SleepRun — Carregando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#E8C468}a:hover{color:#F3D98F}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1115; color: #ECEDEF; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<header style="display: flex; flex-direction: column; gap: 2px; padding: 16px 16px 8px 16px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A9B4">SleepRun</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1">Jogos do GM Krikor</h1>
</header>

<div style="display: flex; gap: 8px; padding: 8px 16px">
<div style="flex: 1; height: 48px; border-radius: 12px; background: #181B22"></div>
<div style="width: 48px; height: 48px; border-radius: 12px; background: #181B22"></div>
</div>
<div style="display: flex; gap: 8px; padding: 4px 16px 8px 16px">
<div style="width: 72px; height: 44px; border-radius: 999px; background: #181B22"></div>
<div style="width: 88px; height: 44px; border-radius: 999px; background: #181B22"></div>
<div style="width: 88px; height: 44px; border-radius: 999px; background: #181B22"></div>
<div style="width: 88px; height: 44px; border-radius: 999px; background: #181B22"></div>
</div>
<div style="margin: 4px 16px 8px 16px; height: 66px; border-radius: 14px; background: #181B22"></div>

<p role="status" style="margin: 4px 16px 8px 16px; font-size: 13px; color: #A3A9B4">Carregando jogos…</p>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #181B22; border: 1px solid #20242C">
<div style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #262A33"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div style="width: 60%; height: 12px; border-radius: 6px; background: #262A33"></div>
<div style="width: 85%; height: 10px; border-radius: 5px; background: #222630"></div>
<div style="width: 45%; height: 10px; border-radius: 5px; background: #222630"></div>
</div>
<div style="width: 44px; height: 18px; border-radius: 6px; background: #262A33"></div>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [1, 2, 3, 4, 5, 6] };
  }
}
</script>
</body>
</html>
